name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t payroll .
      - name: Smoke test the image
        run: |
          docker run -d -p 8788:8788 --name payroll payroll
          for i in $(seq 1 30); do curl -sf localhost:8788/health && break; sleep 1; done
          curl -sf -X POST localhost:8788/v1/payslip -H 'content-type: application/json' \
            -d '{"period":"2026-10","basic_salary":500000,"allowances":[{"name":"Transport","amount":100000}]}' \
            | grep -q '"net_pay":468925'
